<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillTrack — Forgot Password</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <main class="auth-page">

    <!-- Decorative background -->
    <div class="auth-bg" aria-hidden="true">
      <div class="auth-blob auth-blob--one"></div>
      <div class="auth-blob auth-blob--two"></div>
      <div class="auth-blob auth-blob--three"></div>

      <svg class="auth-doodle auth-doodle--cap" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8L4 22l28 14 28-14L32 8z" fill="currentColor"/>
        <path d="M14 28v14c0 4 8 9 18 9s18-5 18-9V28" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M58 22v16" stroke="currentColor" stroke-width="2"/>
      </svg>

      <svg class="auth-doodle auth-doodle--book" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 14c-6-4-16-4-22 0v34c6-4 16-4 22 0" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M32 14c6-4 16-4 22 0v34c-6-4-16-4-22 0" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M32 14v34" stroke="currentColor" stroke-width="2"/>
      </svg>

      <svg class="auth-doodle auth-doodle--spark1" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2L12 0z"/>
      </svg>
      <svg class="auth-doodle auth-doodle--spark2" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2L12 0z"/>
      </svg>
      <svg class="auth-doodle auth-doodle--spark3" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2L12 0z"/>
      </svg>
    </div>

    <!-- Character + card stage -->
    <div class="auth-stage">

      <div class="character-wrap" aria-hidden="true">
        <img src="assets/login-girl.png" class="character" alt="SkillTrack student">
      </div>

      <div class="auth-card">

        <div class="auth-brand">
          <span class="auth-brand__mark">🎓</span>
          <span>SkillTrack</span>
        </div>

        <h1 class="auth-card__title">Forgot your password?</h1>
        <p class="auth-card__subtitle">Enter your email and we'll send you a reset link</p>

        <form class="auth-form" id="forgotForm" autocomplete="on">

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>

          <p id="forgotError" class="auth-error" hidden></p>
          <p id="forgotSuccess" class="auth-success" hidden></p>

          <button type="submit" class="btn-primary" id="forgotSubmit">Send Reset Link</button>

        </form>

        <div class="divider">or</div>

        <p class="auth-card__footer">
          Remembered your password? <a href="login.html" class="link-strong">Log in</a>
        </p>

      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    var forgotForm = document.getElementById('forgotForm');
    var forgotError = document.getElementById('forgotError');
    var forgotSuccess = document.getElementById('forgotSuccess');
    var forgotSubmit = document.getElementById('forgotSubmit');

    forgotForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      var email = document.getElementById('email').value.trim();

      forgotError.hidden = true;
      forgotError.textContent = "";
      forgotSuccess.hidden = true;
      forgotSuccess.textContent = "";

      if (!email) {
        forgotError.textContent = "Please enter your email address.";
        forgotError.hidden = false;
        return;
      }

      forgotSubmit.disabled = true;
      forgotSubmit.textContent = "Sending…";

      // Fire the request, but always show the same generic message
      // regardless of the result — never reveal whether the email
      // exists in the system.
      await SkillTrackAuth.resetPassword(email);

      forgotSubmit.disabled = false;
      forgotSubmit.textContent = "Send Reset Link";

      forgotForm.reset();
      forgotSuccess.textContent = "If an account exists for that email, a password reset link has been sent.";
      forgotSuccess.hidden = false;
    });
  </script>

</body>
</html>
