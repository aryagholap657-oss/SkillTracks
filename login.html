<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillTrack — Log In</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <main class="auth-page">

    <!-- Decorative background -->
    <div class="auth-bg" aria-hidden="true">
      <div class="auth-blob auth-blob--one"></div>
      <div class="auth-blob auth-blob--two"></div>
      <div class="auth-blob auth-blob--three"></div>

      <svg class="auth-doodle auth-doodle--cap" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8L4 22l28 14 28-14L32 8z" fill="currentColor"/>
        <path d="M14 28v14c0 4 8 9 18 9s18-5 18-9V28" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M58 22v16" stroke="currentColor" stroke-width="2"/>
      </svg>

      <svg class="auth-doodle auth-doodle--book" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 14c-6-4-16-4-22 0v34c6-4 16-4 22 0" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M32 14c6-4 16-4 22 0v34c-6-4-16-4-22 0" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M32 14v34" stroke="currentColor" stroke-width="2"/>
      </svg>

      <svg class="auth-doodle auth-doodle--spark1" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2L12 0z"/>
      </svg>
      <svg class="auth-doodle auth-doodle--spark2" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2L12 0z"/>
      </svg>
      <svg class="auth-doodle auth-doodle--spark3" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2L12 0z"/>
      </svg>
    </div>

    <!-- Character + card stage -->
    <div class="auth-stage">

      <div class="character-wrap" aria-hidden="true">
        <img src="assets/login-girl.png" class="character" alt="SkillTrack student">
      </div>

      <div class="auth-card">

        <div class="auth-brand">
          <span class="auth-brand__mark">🎓</span>
          <span>SkillTrack</span>
        </div>

        <h1 class="auth-card__title">Welcome back</h1>
        <p class="auth-card__subtitle">Log in to continue your progress</p>

        <form class="auth-form" id="loginForm" autocomplete="on">

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
              <button type="button" class="toggle-password" aria-label="Show password" data-target="password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="field-row">
            <label class="checkbox">
              <input type="checkbox" name="remember">
              <span>Remember me</span>
            </label>
            <a href="forgot-password.html" class="link-muted">Forgot password?</a>
          </div>

          <p id="loginError" class="auth-error" hidden></p>

          <button type="submit" class="btn-primary" id="loginSubmit">Log In</button>

        </form>

        <div class="divider">or</div>

        <p class="auth-card__footer">
          Don't have an account? <a href="signup.html" class="link-strong">Sign up</a>
        </p>

      </div>
    </div>

  </main>

  <script>
    // Simple show/hide password toggle. No auth logic — placeholder only.
    document.querySelectorAll('.toggle-password').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var input = document.getElementById(btn.dataset.target);
        var isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // If a session already exists, skip login and go straight to the dashboard.
    (async function redirectIfLoggedIn() {
      const { data: { session } } = await SkillTrackAuth.getSession();
      if (session) {
        window.location.href = "index.html";
      }
    })();

    var loginForm = document.getElementById('loginForm');
    var loginError = document.getElementById('loginError');
    var loginSubmit = document.getElementById('loginSubmit');

    loginForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;

      loginError.hidden = true;
      loginError.textContent = "";

      if (!email || !password) {
        loginError.textContent = "Please enter both email and password.";
        loginError.hidden = false;
        return;
      }

      loginSubmit.disabled = true;
      loginSubmit.textContent = "Logging in…";

      const { data, error } = await SkillTrackAuth.login(email, password);

      loginSubmit.disabled = false;
      loginSubmit.textContent = "Log In";

      if (error) {
        loginError.textContent = "We couldn't log you in. Please check your email and password and try again.";
        loginError.hidden = false;
        return;
      }

      window.location.href = "index.html";
    });
  </script>

</body>
</html>
