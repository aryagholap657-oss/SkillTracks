<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillTrack — Reset Password</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <main class="auth-page">

    <!-- Decorative background -->
    <div class="auth-bg" aria-hidden="true">
      <div class="auth-blob auth-blob--one"></div>
      <div class="auth-blob auth-blob--two"></div>
      <div class="auth-blob auth-blob--three"></div>

      <svg class="auth-doodle auth-doodle--cap" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8L4 22l28 14 28-14L32 8z" fill="currentColor"/>
        <path d="M14 28v14c0 4 8 9 18 9s18-5 18-9V28" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M58 22v16" stroke="currentColor" stroke-width="2"/>
      </svg>

      <svg class="auth-doodle auth-doodle--book" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 14c-6-4-16-4-22 0v34c6-4 16-4 22 0" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M32 14c6-4 16-4 22 0v34c-6-4-16-4-22 0" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M32 14v34" stroke="currentColor" stroke-width="2"/>
      </svg>

      <svg class="auth-doodle auth-doodle--spark1" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2L12 0z"/>
      </svg>
      <svg class="auth-doodle auth-doodle--spark2" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2L12 0z"/>
      </svg>
      <svg class="auth-doodle auth-doodle--spark3" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2L12 0z"/>
      </svg>
    </div>

    <!-- Character + card stage -->
    <div class="auth-stage">

      <div class="character-wrap" aria-hidden="true">
        <img src="assets/login-girl.png" class="character" alt="SkillTrack student">
      </div>

      <div class="auth-card">

        <div class="auth-brand">
          <span class="auth-brand__mark">🎓</span>
          <span>SkillTrack</span>
        </div>

        <h1 class="auth-card__title">Set a new password</h1>
        <p class="auth-card__subtitle">Choose a new password for your account</p>

        <p id="linkWarning" class="auth-error" hidden>
          This reset link is invalid or has expired. Please request a new one from the
          <a href="forgot-password.html" class="link-strong">forgot password</a> page.
        </p>

        <form class="auth-form" id="resetForm" autocomplete="on">

          <div class="field">
            <label for="newPassword">New Password</label>
            <div class="password-wrap">
              <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required minlength="6">
              <button type="button" class="toggle-password" aria-label="Show password" data-target="newPassword">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="confirmNewPassword">Confirm New Password</label>
            <div class="password-wrap">
              <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="Re-enter new password" required minlength="6">
              <button type="button" class="toggle-password" aria-label="Show password" data-target="confirmNewPassword">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <p id="resetError" class="auth-error" hidden></p>
          <p id="resetSuccess" class="auth-success" hidden></p>

          <button type="submit" class="btn-primary" id="resetSubmit">Update Password</button>

        </form>

        <div class="divider">or</div>

        <p class="auth-card__footer">
          <a href="login.html" class="link-strong">Back to log in</a>
        </p>

      </div>
    </div>

  </main>

  <script>
    // Simple show/hide password toggle. No auth logic — placeholder only.
    document.querySelectorAll('.toggle-password').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var input = document.getElementById(btn.dataset.target);
        var isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    var resetForm = document.getElementById('resetForm');
    var resetError = document.getElementById('resetError');
    var resetSuccess = document.getElementById('resetSuccess');
    var resetSubmit = document.getElementById('resetSubmit');
    var linkWarning = document.getElementById('linkWarning');

    var hasRecoverySession = false;

    // Supabase's client library automatically parses the recovery token
    // from the URL fragment (detectSessionInUrl is on by default) and
    // fires a PASSWORD_RECOVERY auth event once that session is set up.
    SkillTrackAuth.onAuthStateChange(function (event, session) {
      if (event === "PASSWORD_RECOVERY" && session) {
        hasRecoverySession = true;
        linkWarning.hidden = true;
      }
    });

    // Fallback check: if the user already has a valid session by the
    // time this page finishes loading (e.g. the recovery event fired
    // before this listener was attached), allow the form as well.
    (async function checkExistingSession() {
      const { data } = await SkillTrackAuth.getSession();
      if (data && data.session) {
        hasRecoverySession = true;
        linkWarning.hidden = true;
      } else {
        // Give the async URL-fragment handling a brief moment before
        // deciding the link is invalid.
        setTimeout(function () {
          if (!hasRecoverySession) {
            linkWarning.hidden = false;
          }
        }, 1500);
      }
    })();

    resetForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      var newPassword = document.getElementById('newPassword').value;
      var confirmNewPassword = document.getElementById('confirmNewPassword').value;

      resetError.hidden = true;
      resetError.textContent = "";
      resetSuccess.hidden = true;
      resetSuccess.textContent = "";

      if (!newPassword || !confirmNewPassword) {
        resetError.textContent = "Please fill in both password fields.";
        resetError.hidden = false;
        return;
      }

      if (newPassword !== confirmNewPassword) {
        resetError.textContent = "Passwords do not match.";
        resetError.hidden = false;
        return;
      }

      resetSubmit.disabled = true;
      resetSubmit.textContent = "Updating…";

      const { data, error } = await SkillTrackAuth.updatePassword(newPassword);

      resetSubmit.disabled = false;
      resetSubmit.textContent = "Update Password";

      if (error) {
        resetError.textContent = "We couldn't update your password. " + (error.message || "Please try requesting a new reset link.");
        resetError.hidden = false;
        return;
      }

      resetForm.reset();
      resetSuccess.textContent = "Your password has been updated. You can now log in with your new password.";
      resetSuccess.hidden = false;
    });
  </script>

</body>
</html>
