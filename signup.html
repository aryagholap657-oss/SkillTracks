<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillTrack — Sign Up</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <main class="auth-page">

    <!-- Decorative background -->
    <div class="auth-bg" aria-hidden="true">
      <div class="auth-blob auth-blob--one"></div>
      <div class="auth-blob auth-blob--two"></div>
      <div class="auth-blob auth-blob--three"></div>

      <svg class="auth-doodle auth-doodle--cap" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8L4 22l28 14 28-14L32 8z" fill="currentColor"/>
        <path d="M14 28v14c0 4 8 9 18 9s18-5 18-9V28" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M58 22v16" stroke="currentColor" stroke-width="2"/>
      </svg>

      <svg class="auth-doodle auth-doodle--book" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 14c-6-4-16-4-22 0v34c6-4 16-4 22 0" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M32 14c6-4 16-4 22 0v34c-6-4-16-4-22 0" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M32 14v34" stroke="currentColor" stroke-width="2"/>
      </svg>

      <svg class="auth-doodle auth-doodle--spark1" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2L12 0z"/>
      </svg>
      <svg class="auth-doodle auth-doodle--spark2" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2L12 0z"/>
      </svg>
      <svg class="auth-doodle auth-doodle--spark3" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2L12 0z"/>
      </svg>
    </div>

    <!-- Character + card stage -->
    <div class="auth-stage">

      <div class="character-wrap" aria-hidden="true">
        <img src="assets/login-girl.png" class="character" alt="SkillTrack student">
      </div>

      <div class="auth-card">

        <div class="auth-brand">
          <span class="auth-brand__mark">🎓</span>
          <span>SkillTrack</span>
        </div>

        <h1 class="auth-card__title">Create your account</h1>
        <p class="auth-card__subtitle">Start tracking your skills and career growth</p>

        <form class="auth-form" id="signupForm" autocomplete="on">

          <div class="field">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Your full name" required>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="Create a password" required minlength="6">
              <button type="button" class="toggle-password" aria-label="Show password" data-target="password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-wrap">
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required minlength="6">
              <button type="button" class="toggle-password" aria-label="Show password" data-target="confirmPassword">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <p id="signupError" class="auth-error" hidden></p>
          <p id="signupSuccess" class="auth-success" hidden></p>

          <button type="submit" class="btn-primary" id="signupSubmit">Sign Up</button>

        </form>

        <div class="divider">or</div>

        <p class="auth-card__footer">
          Already have an account? <a href="login.html" class="link-strong">Log in</a>
        </p>

      </div>
    </div>

  </main>

  <script>
    // Simple show/hide password toggle. No auth logic — placeholder only.
    document.querySelectorAll('.toggle-password').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var input = document.getElementById(btn.dataset.target);
        var isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    var signupForm = document.getElementById('signupForm');
    var signupError = document.getElementById('signupError');
    var signupSuccess = document.getElementById('signupSuccess');
    var signupSubmit = document.getElementById('signupSubmit');

    signupForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      var fullName = document.getElementById('fullName').value.trim();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var confirmPassword = document.getElementById('confirmPassword').value;

      signupError.hidden = true;
      signupError.textContent = "";
      signupSuccess.hidden = true;
      signupSuccess.textContent = "";

      if (!fullName || !email || !password || !confirmPassword) {
        signupError.textContent = "Please fill in all fields.";
        signupError.hidden = false;
        return;
      }

      if (password !== confirmPassword) {
        signupError.textContent = "Passwords do not match.";
        signupError.hidden = false;
        return;
      }

      signupSubmit.disabled = true;
      signupSubmit.textContent = "Creating account…";

      const { data, error } = await SkillTrackAuth.signup(email, password, fullName);

      signupSubmit.disabled = false;
      signupSubmit.textContent = "Sign Up";

      if (error) {
        signupError.textContent = "We couldn't create your account. " + (error.message || "Please try again.");
        signupError.hidden = false;
        return;
      }

      // Email confirmation is enabled, so there is no active session yet.
      // Do not redirect to the dashboard — tell the user to confirm first.
      signupForm.reset();
      signupSuccess.textContent = "Account created! Please check your email to confirm your address before logging in.";
      signupSuccess.hidden = false;
    });
  </script>

</body>
</html>
